# Real-time Brake Pressure Monitoring Query
# Sliding 30s/10s windows over PCFA/PCFF variance, emitted to an MQTT topic.

query: |
  SELECT start, end, device_id, VAR(PCFA_mbar) AS PCFA_var, VAR(PCFF_mbar) AS PCFF_var
  FROM gps_data
  GROUP BY device_id
  WINDOW SLIDING(time_utc, SIZE 30 SEC, ADVANCE BY 10 SEC)
  INTO brake_alerts_stream;

sinks:
  - name: brake_alerts_stream
    type: MQTTSink
    schema:
      - { name: GPS_DATA$START,     type: UINT64  }
      - { name: GPS_DATA$END,       type: UINT64  }
      - { name: GPS_DATA$DEVICE_ID, type: UINT64  }
      - { name: GPS_DATA$PCFA_VAR,  type: FLOAT64 }
      - { name: GPS_DATA$PCFF_VAR,  type: FLOAT64 }
    config:
      serverURI:   "tcp://mosquitto:1883"
      clientId:    "nebulastream_brake_monitor"
      topic:       "sncb/brake/alerts"
      qos:         1
      cleanSession: true
      inputFormat: CSV

logical:
  - name: gps_data
    schema:
      - { name: time_utc,   type: UINT64  }
      - { name: device_id,  type: UINT64  }
      - { name: Vbat,       type: FLOAT64 }
      - { name: PCFA_mbar,  type: FLOAT64 }
      - { name: PCFF_mbar,  type: FLOAT64 }
      - { name: PCF1_mbar,  type: FLOAT64 }
      - { name: PCF2_mbar,  type: FLOAT64 }
      - { name: T1_mbar,    type: FLOAT64 }
      - { name: T2_mbar,    type: FLOAT64 }
      - { name: Code1,      type: FLOAT64 }
      - { name: Code2,      type: FLOAT64 }
      - { name: gps_speed,  type: FLOAT64 }
      - { name: gps_lat,    type: FLOAT64 }
      - { name: gps_lon,    type: FLOAT64 }

physical:
  - logical: gps_data
    type: TCP
    parser_config:
      type: CSV
      field_delimiter: ","
      tuple_delimiter: "\n"
    source_config:
      socket_host: "host.docker.internal"
      socket_port: "9000"
      flush_interval_ms: "100"
      connect_timeout_ms: "5000"
      auto_reconnect: "true"
