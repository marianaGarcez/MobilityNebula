services:
  nes-worker:
    image: ${NES_RUNTIME_IMAGE:-ghcr.io/marianagarcez/mobility-nebula:feature-upstream-update-tcp-reconnect}
    container_name: nes-worker
    environment:
      NES_WORKER_THREADS: ${NES_WORKER_THREADS:-2}
    # Override the image ENTRYPOINT (nes-single-node-worker) so we can wrap the
    # binary in bash and expand the thread-count env var at container start.
    entrypoint: []
    command:
      - /bin/bash
      - -c
      - nes-single-node-worker --worker.query_engine.number_of_worker_threads=$$NES_WORKER_THREADS
    ports:
      - "8080:8080"
    volumes:
      - ./Queries:/workspace/Queries:ro
      - ./Output:/workspace/Output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  query-registration:
    image: ${NES_RUNTIME_IMAGE:-ghcr.io/marianagarcez/mobility-nebula:feature-upstream-update-tcp-reconnect}
    depends_on:
      nes-worker:
        condition: service_healthy
    volumes:
      - ./Queries:/workspace/Queries:ro
    entrypoint: []
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        QUERY_FILE="/workspace/Queries/${NES_QUERY_FILE:-Query1-csv.yaml}"
        if [[ ! -f "$$QUERY_FILE" ]]; then
            echo "Query file $$QUERY_FILE not found. Mount the deploy bundle's Queries/ directory or set NES_QUERY_FILE." >&2
            exit 1
        fi
        for i in {1..60}; do
          if (echo > /dev/tcp/nes-worker/8080) >/dev/null 2>&1; then
            break
          fi
          echo "Waiting for nes-worker to be reachable..."
          sleep 1
        done
        nes-cli -d -s nes-worker:8080 -t "$$QUERY_FILE" start
        echo "Query submitted from $$QUERY_FILE; holding container so Docker does not drop the restart policy on success."
        exec tail -f /dev/null
    restart: unless-stopped
