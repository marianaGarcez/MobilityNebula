name: NROK Gateway Release

# Builds and publishes:
#   1. Docker image → GitHub Container Registry (ghcr.io)
#   2. .deb package → GitHub Releases (downloadable via wget)
#
# Target: NROK-1030 railway gateway (x86_64 Intel Atom)
#
# Usage on NROK gateway:
#   wget https://github.com/<owner>/MobilityNebula/releases/download/<tag>/mobility-nebula_<ver>_amd64.deb
#   sudo dpkg -i mobility-nebula_*.deb
#
#   docker pull ghcr.io/<owner>/mobility-nebula:<tag>

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0). Defaults to tag name or short SHA.'
        required: false
        type: string
      dev_image_tag:
        description: 'Dev image tag (nebulastream/nes-development:<tag>). Leave empty to auto-detect.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mobility-nebula

jobs:
  # ─── Determine version and dev image tag ───────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dev_tag: ${{ steps.dev-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine dev image tag
        id: dev-tag
        run: |
          if [ -n "${{ inputs.dev_image_tag }}" ]; then
            echo "tag=${{ inputs.dev_image_tag }}" >> "$GITHUB_OUTPUT"
          else
            # Try the current dependency hash first, fall back to latest upstream
            HASH=$(docker/dependency/hash_dependencies.sh)
            TAG="${HASH}-x64-libcxx-none"
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://hub.docker.com/v2/namespaces/nebulastream/repositories/nes-development/tags/${TAG}")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Dev image for hash ${HASH} not found, discovering latest available x64 tag"
              LATEST_TAG=$(curl -s "https://hub.docker.com/v2/namespaces/nebulastream/repositories/nes-development/tags?page_size=100" \
                | python3 -c "
          import sys, json
          tags = json.load(sys.stdin).get('results', [])
          x64 = [t['name'] for t in tags if 'x64-libcxx-none' in t['name']]
          print(x64[0] if x64 else '')" )
              if [ -n "$LATEST_TAG" ]; then
                echo "::notice::Using latest upstream dev image: ${LATEST_TAG}"
                echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
              else
                echo "::error::No x64 dev image found on DockerHub"
                exit 1
              fi
            fi
          fi

  # ─── Build Docker image and push to GHCR ──────────────────────────
  docker-image:
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.prepare.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            TAG=${{ needs.prepare.outputs.dev_tag }}
            BUILD_TYPE=RelWithDebInfo
          context: .
          file: packaging/nrok/Dockerfile.nrok
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Build .deb package and upload to GitHub Releases ──────────────
  deb-package:
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binaries in Docker
        run: |
          # Build project inside dev container, extract binaries
          docker build \
            --build-arg TAG=${{ needs.prepare.outputs.dev_tag }} \
            --build-arg BUILD_TYPE=RelWithDebInfo \
            --target build \
            -t mobility-nebula-build:local \
            -f packaging/nrok/Dockerfile.nrok .

          # Extract binaries and libs from the build container
          mkdir -p artifacts/bin artifacts/lib
          CONTAINER_ID=$(docker create mobility-nebula-build:local)
          docker cp "${CONTAINER_ID}:/tmp/bin/." artifacts/bin/
          docker cp "${CONTAINER_ID}:/tmp/lib/." artifacts/lib/ 2>/dev/null || true
          docker rm "${CONTAINER_ID}"

          echo "Extracted binaries:"
          ls -la artifacts/bin/
          echo "Extracted libraries:"
          ls -la artifacts/lib/ 2>/dev/null || echo "(none)"

      - name: Build .deb package
        run: |
          chmod +x packaging/nrok/build-deb.sh
          packaging/nrok/build-deb.sh \
            "${{ needs.prepare.outputs.version }}" \
            artifacts/bin \
            artifacts/lib \
            dist/

          echo "Built packages:"
          ls -la dist/

      - name: Upload .deb as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobility-nebula-deb
          path: dist/*.deb

      - name: Create GitHub Release and upload .deb
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.prepare.outputs.version) }}
          name: "MobilityNebula ${{ needs.prepare.outputs.version }}"
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: dist/*.deb
          body: |
            ## MobilityNebula ${{ needs.prepare.outputs.version }}

            ### NROK-1030 Gateway Installation

            **Download and install the .deb package:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ needs.prepare.outputs.version }}/mobility-nebula_${{ needs.prepare.outputs.version }}_amd64.deb
            sudo dpkg -i mobility-nebula_${{ needs.prepare.outputs.version }}_amd64.deb
            sudo apt-get install -f  # install dependencies if needed
            sudo systemctl start mobility-nebula
            ```

            **Or pull the Docker image:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            docker run -d --name mobility-nebula \
              -p 8081:8081 -p 4000:4000 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            ```
